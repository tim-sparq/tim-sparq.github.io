<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News – 21 May 2025</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Helvetica Neue', sans-serif;
      background: #f4f4f4;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .page-title {
      font-size: 20px;
      color: #333333;
      letter-spacing: 2px;
      text-align: center;
      width: 100%;
      padding: 20px 10px;
      margin-bottom: 20px;
      z-index: 1000;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: auto;
      gap: 15px;
      max-width: 960px;
      width: 100%;
    }

    .container a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .tile {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 1;
      opacity: 0;
      transform: translateY(10px);
      height: 100%;
    }

    .tile.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .tile:hover {
      z-index: 10;
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .tile h2 {
      font-size: 18px;
      margin: 0 0 10px;
      font-weight: bold;
    }

    .tile p {
      font-size: 14px;
      color: #555;
      margin: 0;
    }

    .source-line {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .source-line img {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border-radius: 2px;
    }

    /* Featured styling */
    .featured {
      grid-column: span 2;
      background: #fffdf5;
      border: 1px solid #f1e6d4;
      min-height: 260px;
    }

    .featured h2 {
      font-size: 22px;
    }

    .featured .source-line span {
      margin-left: auto;
      color: #e67e22;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }

      .featured {
        grid-column: span 2;
      }
    }

    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }

      .featured {
        grid-column: span 1;
      }

      .page-title {
        padding: 10px;
        margin-bottom: 10px;
      }

      body {
        padding: 15px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page-title">2025 · 05 · 21</div>
  <div class="container" id="grid"></div>

  <script>
    const articles = [
      {
        source: "Financial Times",
        favicon: "https://www.ft.com/favicon.ico",
        title: "Nvidia CEO Criticizes US AI Chip Export Restrictions to China",
        summary: "Jensen Huang labels US export controls on AI chips to China as a 'failure,' noting they have accelerated Chinese tech firms' development of competitive alternatives.",
        link: "https://www.ft.com/content/a3fce85c-8651-4fec-ab6a-c876ec01a547"
      },
      {
        source: "Axios",
        favicon: "https://www.axios.com/favicon.ico",
        title: "Google Leaders Predict AGI by 2030",
        summary: "At Google I/O, Sergey Brin and Demis Hassabis forecast the emergence of artificial general intelligence around 2030, emphasizing the need for significant breakthroughs.",
        link: "https://www.axios.com/2025/05/21/google-sergey-brin-demis-hassabis-agi-2030"
      },
      {
        source: "Associated Press",
        favicon: "https://apnews.com/favicon.ico",
        title: "Musk Vows to Deploy Self-Driving Teslas by 2026",
        summary: "Elon Musk announces plans to deploy hundreds of thousands of fully autonomous Teslas on U.S. roads by the end of 2026, starting with a self-driving taxi service in Austin.",
        link: "https://apnews.com/article/76e38b748142268260a79bd72071f7f8"
      },
      {
        source: "Financial Times",
        favicon: "https://www.ft.com/favicon.ico",
        title: "Google Introduces 'AI Mode' in Search Engine",
        summary: "Google unveils 'AI Mode' in its search engine, enabling conversational interactions and integrating the Gemini 2.5 model for enhanced user experience.",
        link: "https://www.ft.com/content/b9d13cc7-f0f0-4d0d-9dfd-7d387ac2cdf9"
      },
      {
        source: "Axios",
        favicon: "https://www.axios.com/favicon.ico",
        title: "Security Contractors Adjust to DOGE's AI Initiatives",
        summary: "Security contractors adapt to cost-cutting measures by the Department of Government Efficiency, which is centralizing data and considering AI replacements for federal workers.",
        link: "https://www.axios.com/newsletters/axios-future-of-cybersecurity-af1f1e70-31b1-11f0-b8ba-2bf3d1911d98"
      },
      {
        source: "BBC News",
        favicon: "https://www.bbc.com/favicon.ico",
        title: "Apple Urged to Withdraw 'Out of Control' AI News Alerts",
        summary: "Apple faces calls to withdraw its AI feature that has generated inaccurate news alerts, with critics labeling the technology as 'out of control' and a misinformation risk.",
        link: "https://www.bbc.com/news/articles/cge93de21n0o"
      },
      {
        source: "Reuters",
        favicon: "https://www.reuters.com/favicon.ico",
        title: "Nvidia CEO Praises Trump Move to Scrap Some AI Export Curbs",
        summary: "Jensen Huang criticizes Biden's AI export controls to China as a failure and praises Trump's proposed reversal, citing significant financial losses for U.S. companies.",
        link: "https://www.reuters.com/world/china/nvidia-says-us-export-controls-ai-china-were-a-failure-2025-05-21/"
      }
    ];

    function calculateContentSize(article) {
      return article.title.length * 0.5 + article.summary.length;
    }

    function assignGridPositions() {
      const articlesWithSize = articles.map((article, index) => ({
        ...article,
        size: calculateContentSize(article),
        index
      }));

      articlesWithSize.sort((a, b) => b.size - a.size);

      return articlesWithSize.map((article, sortedIndex) => ({
        ...article,
        featured: sortedIndex === 0,
        tallContent: sortedIndex === 1 || sortedIndex === 2
      }));
    }

    function createTile(article) {
      const className = `tile ${article.featured ? 'featured' : ''}`;
      return `
        <a href="${article.link}" target="_blank">
          <div class="${className}">
            <div class="source-line">
              <img src="${article.favicon}" onerror="this.style.display='none'" alt="${article.source}">
              ${article.source}
              ${article.featured ? '<span>★ Featured</span>' : ''}
            </div>
            <h2>${article.title}</h2>
            <p>${article.summary}</p>
          </div>
        </a>
      `;
    }

    function populateTiles() {
      const grid = document.getElementById("grid");
      const layoutConfig = assignGridPositions();
      grid.innerHTML = layoutConfig.map(createTile).join('');
    }

    window.addEventListener('load', () => {
      populateTiles();
      setTimeout(() => {
        document.querySelectorAll('.tile').forEach(tile => {
          tile.classList.add('loaded');
        });
      }, 100);
    });
  </script>
</body>
</html>
