<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News – 22 May 2025</title>
  <!-- Font Awesome for the eye icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Helvetica Neue', sans-serif;
      background: #f4f4f4;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 20px 30px 20px; /* Reduced top padding from 30px to 15px */
      box-sizing: border-box;
    }

    .page-title {
      font-size: 20px;
      color: #333333;
      letter-spacing: 2px;
      text-align: center;
      width: 100%;
      padding: 10px 10px; /* Consistent padding all around */
      margin: 0 0 10px 0; /* Removed any default top margin, kept bottom margin */
      z-index: 1000;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      font-size: 16px;
      color: #666;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: auto;
      gap: 15px;
      max-width: 960px;
      width: 100%;
    }

    .container a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .tile {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 1;
      opacity: 0;
      transform: translateY(10px);
      height: 100%;
    }

    .tile.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .tile:hover {
      z-index: 10;
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .tile h2 {
      font-size: 18px;
      margin: 0 0 10px;
      font-weight: bold;
    }

    .tile p {
      font-size: 14px;
      color: #555;
      margin: 0;
    }

    .source-line {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
      width: 100%;
    }

    .source-line img {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border-radius: 2px;
    }
    
    .view-count {
      margin-left: auto;
      color: #e67e22;
      display: flex;
      align-items: center;
      font-weight: bold;
    }
    
    .view-count i {
      margin-right: 4px;
    }
    
    .view-count-value {
      position: relative;
      display: inline-block;
      min-width: 24px;
      text-align: right;
    }

    .view-animation {
      animation: pulse 0.4s ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      50% {
        transform: translateY(-5px);
        opacity: 0.5;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .featured {
      grid-column: span 2;
      background: #fffdf5;
      border: 1px solid #f1e6d4;
      min-height: 260px;
    }

    .featured h2 {
      font-size: 22px;
    }

    .error {
      color: #e74c3c;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }

      .featured {
        grid-column: span 2;
      }
    }

    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }

      .featured {
        grid-column: span 1;
      }

      .page-title {
        padding: 5px; /* Equal padding all around */
        margin: 0 0 5px 0; /* No top margin, 5px bottom margin */
      }

      body {
        padding: 10px 10px 15px 10px; /* Reduced and balanced padding */
      }
    }
  </style>
</head>
<body>
  <div class="page-title" id="page-title"></div>
  <div id="loading" class="loading">Loading articles...</div>
  <div class="container" id="grid" style="display: none;"></div>

  <script>
    // Global variables
    let articles = [];
    let currentViews = [];

    // Set the current date in the header
    function setCurrentDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      
      document.getElementById('page-title').textContent = `${year} · ${month} · ${day}`;
    }

    // Load articles from JSON file
    async function loadArticles() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        articles = data.articles;
        currentViews = articles.map(article => article.views);
        
        // Hide loading and show grid
        document.getElementById('loading').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        
        // Populate the tiles
        populateTiles();
        
        // Animate tiles in
        setTimeout(() => {
          document.querySelectorAll('.tile').forEach(tile => {
            tile.classList.add('loaded');
          });
          
          // Start the view count update loop
          setInterval(updateRandomViewCounts, 3000);
        }, 100);
        
      } catch (error) {
        console.error('Error loading articles:', error);
        document.getElementById('loading').innerHTML = `
          <div class="error">
            Error: ${error.message}
          </div>
        `;
      }
    }
    
    function getRandomInt(min, max) {
      min = Math.ceil(min);
      max = Math.floor(max);
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function formatViewCount(count) {
      if (count >= 1000) {
        return (count / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      }
      return count.toString();
    }

    function assignGridPositions() {
      // Find the article with maximum views
      let maxViewsIndex = 0;
      let maxViews = currentViews[0];
      
      for (let i = 1; i < currentViews.length; i++) {
        if (currentViews[i] > maxViews) {
          maxViews = currentViews[i];
          maxViewsIndex = i;
        }
      }
      
      // Add index to each article
      const articlesWithIndex = articles.map((article, index) => ({
        ...article,
        index,
        views: currentViews[index]
      }));
      
      return articlesWithIndex.map((article, index) => ({
        ...article,
        featured: index === maxViewsIndex,  // Feature only the article with max views
        tallContent: (index !== maxViewsIndex) && (index < 2 || index === 2)  // Make first 2 non-featured articles tall
      }));
    }

    function createTile(article) {
      const className = `tile ${article.featured ? 'featured' : ''}`;
      const formattedViews = formatViewCount(article.views);
      
      return `
        <a href="${article.link}" target="_blank">
          <div class="${className}" data-article-index="${article.index}">
            <div class="source-line">
              <img src="${article.favicon}" onerror="this.style.display='none'" alt="${article.source}">
              ${article.source}
              <div class="view-count">
                <i class="fa-regular fa-eye"></i> 
                <span class="view-count-value" data-article-index="${article.index}">${formattedViews}</span>
              </div>
            </div>
            <h2>${article.title}</h2>
            <p>${article.summary}</p>
          </div>
        </a>
      `;
    }

    function populateTiles() {
      const grid = document.getElementById("grid");
      const layoutConfig = assignGridPositions();
      grid.innerHTML = layoutConfig.map(createTile).join('');
    }

    // Function to animate the view count change with a simpler animation
    function animateViewCount(element, newValue) {
      // Add the animation class
      element.classList.add('view-animation');
      
      // Update the text after a slight delay
      setTimeout(() => {
        element.textContent = newValue;
        
        // Remove the animation class after it completes
        setTimeout(() => {
          element.classList.remove('view-animation');
        }, 400);
      }, 200);
    }

    // Function to update random view counts
    function updateRandomViewCounts() {
      // Determine how many articles to update (1-3)
      const updateCount = getRandomInt(1, 3);
      
      // Randomly select articles to update
      const articlesToUpdate = new Set();
      while (articlesToUpdate.size < updateCount) {
        articlesToUpdate.add(getRandomInt(0, articles.length - 1));
      }
      
      // Update each selected article
      articlesToUpdate.forEach(index => {
        const incrementAmount = getRandomInt(1, 8);
        const oldValue = currentViews[index];
        const oldFormattedValue = formatViewCount(oldValue);
        
        // Update the actual view count
        currentViews[index] += incrementAmount;
        const newFormattedValue = formatViewCount(currentViews[index]);
        
        // Find the element and update it with animation ONLY if the formatted value changed
        const viewCountElement = document.querySelector(`.view-count-value[data-article-index="${index}"]`);
        if (viewCountElement && oldFormattedValue !== newFormattedValue) {
          animateViewCount(viewCountElement, newFormattedValue);
        } else if (viewCountElement) {
          // If the displayed value hasn't changed, just update the text without animation
          viewCountElement.textContent = newFormattedValue;
        }
      });
      
      // Check if featured article needs to change
      const currentMax = Math.max(...currentViews);
      const currentMaxIndex = currentViews.indexOf(currentMax);
      
      const tileElements = document.querySelectorAll('.tile');
      let oldMaxIndex = -1;
      
      tileElements.forEach(tile => {
        const index = parseInt(tile.getAttribute('data-article-index'));
        if (tile.classList.contains('featured')) {
          oldMaxIndex = index;
        }
      });
      
      if (currentMaxIndex !== oldMaxIndex && oldMaxIndex !== -1) {
        // Featured article changed, update the layout
        setTimeout(() => {
          const oldFeatured = document.querySelector(`.tile[data-article-index="${oldMaxIndex}"]`);
          const newFeatured = document.querySelector(`.tile[data-article-index="${currentMaxIndex}"]`);
          
          if (oldFeatured) oldFeatured.classList.remove('featured');
          if (newFeatured) newFeatured.classList.add('featured');
        }, 600);
      }
    }

    // Initialize the application
    window.addEventListener('load', () => {
      // Set the current date first
      setCurrentDate();
      // Then load articles
      loadArticles();
    });
  </script>
</body>
</html>
